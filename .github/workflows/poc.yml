name: lsm-rawpage-oob

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'

      - name: Fetch upstream lsm-tree at audited commit
        run: |
          git clone https://github.com/IntersectMBO/lsm-tree.git upstream
          cd upstream
          git checkout 63a6305
          git log --oneline -1
          mkdir -p lsm-tree/poc
          cp ../Poc.hs lsm-tree/poc/Poc.hs
          cat ../poc-stanza.txt >> lsm-tree/lsm-tree.cabal
          cabal update

      - name: A. RELEASE config (production, asserts compiled away)
        run: |
          cd upstream
          set +e
          cabal build poc-oob \
            --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" > ../A-release.log 2>&1
          echo "BUILD_EXIT=$?" >> ../A-release.log
          BIN=$(find dist-newstyle -type f -name poc-oob -perm -u+x | head -1)
          echo "binary: $BIN" >> ../A-release.log
          if [ -n "$BIN" ]; then
            stdbuf -o0 -e0 "$BIN" >> ../A-release.log 2>&1
            RC=$?
            echo "RUN_EXIT=$RC" >> ../A-release.log
            if [ $RC -gt 128 ]; then echo "SIGNAL=$((RC-128)) (SIGSEGV=11 SIGABRT=6)" >> ../A-release.log; fi
          else
            echo "RUN_EXIT=NOBIN" >> ../A-release.log
          fi
        continue-on-error: true

      - name: B. RELEASE config + asserts restored (guard proof)
        run: |
          cd upstream
          set +e
          cabal build poc-oob \
            --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" \
            --ghc-options="-fno-ignore-asserts" \
            --builddir=dist-asserts > ../B-release-asserts.log 2>&1
          echo "BUILD_EXIT=$?" >> ../B-release-asserts.log
          BIN=$(find dist-asserts -type f -name poc-oob -perm -u+x | head -1)
          echo "binary: $BIN" >> ../B-release-asserts.log
          if [ -n "$BIN" ]; then
            stdbuf -o0 -e0 "$BIN" >> ../B-release-asserts.log 2>&1
            RC=$?
            echo "RUN_EXIT=$RC" >> ../B-release-asserts.log
            if [ $RC -gt 128 ]; then echo "SIGNAL=$((RC-128)) (SIGSEGV=11 SIGABRT=6)" >> ../B-release-asserts.log; fi
          else
            echo "RUN_EXIT=NOBIN" >> ../B-release-asserts.log
          fi
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-logs
          path: |
            A-release.log
            B-release-asserts.log

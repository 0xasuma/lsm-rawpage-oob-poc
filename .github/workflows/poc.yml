name: lsm-rawpage-oob

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'

      - name: Fetch upstream lsm-tree at audited commit
        run: |
          git clone https://github.com/IntersectMBO/lsm-tree.git upstream
          cd upstream
          git checkout 63a6305
          git log --oneline -1
          mkdir -p lsm-tree/poc
          cp ../Poc.hs lsm-tree/poc/Poc.hs
          cat ../poc-stanza.txt >> lsm-tree/lsm-tree.cabal
          cabal update

      # (A) Production configuration: cabal.project.release, asserts compiled away
      - name: A. RELEASE config (production)
        run: |
          cd upstream
          set +e
          cabal build poc-oob \
            --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" > ../A-release.log 2>&1
          echo "BUILD_EXIT=$?" >> ../A-release.log
          BIN=$(cabal list-bin poc-oob --project-file=cabal.project.release 2>/dev/null)
          echo "binary: $BIN" >> ../A-release.log
          stdbuf -o0 -e0 "$BIN" >> ../A-release.log 2>&1
          echo "RUN_EXIT=$?" >> ../A-release.log
        continue-on-error: true

      # (B) Same release config, asserts restored -> proves the guard exists and fires
      - name: B. RELEASE config + asserts restored
        run: |
          cd upstream
          set +e
          cabal build poc-oob \
            --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" \
            --ghc-options="-fno-ignore-asserts" \
            --builddir=dist-asserts > ../B-release-asserts.log 2>&1
          echo "BUILD_EXIT=$?" >> ../B-release-asserts.log
          BIN=$(cabal list-bin poc-oob --project-file=cabal.project.release \
                  --ghc-options="-fno-ignore-asserts" --builddir=dist-asserts 2>/dev/null)
          echo "binary: $BIN" >> ../B-release-asserts.log
          stdbuf -o0 -e0 "$BIN" >> ../B-release-asserts.log 2>&1
          echo "RUN_EXIT=$?" >> ../B-release-asserts.log
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-logs
          path: |
            A-release.log
            B-release-asserts.log

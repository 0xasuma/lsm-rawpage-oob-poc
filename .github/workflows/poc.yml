name: lsm-rawpage-oob

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'

      - name: Fetch upstream lsm-tree at audited commit
        run: |
          git clone https://github.com/IntersectMBO/lsm-tree.git upstream
          cd upstream
          git checkout 63a6305
          git log --oneline -1
          mkdir -p lsm-tree/poc
          cp ../Poc.hs lsm-tree/poc/Poc.hs
          cat ../poc-stanza.txt >> lsm-tree/lsm-tree.cabal
          cabal update

      # (A) Production configuration: cabal.project.release, no assert restoration
      - name: A. RELEASE config (production)
        run: |
          cd upstream
          cabal test poc-oob \
            --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" \
            --test-show-details=streaming > ../A-release.log 2>&1
          echo "EXIT=$?" >> ../A-release.log
        continue-on-error: true

      # (B) Same release config but with asserts restored -> proves the guard exists
      - name: B. RELEASE config + asserts restored
        run: |
          cd upstream
          cabal test poc-oob \
            --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" \
            --ghc-options="-fno-ignore-asserts" \
            --builddir=dist-asserts \
            --test-show-details=streaming > ../B-release-asserts.log 2>&1
          echo "EXIT=$?" >> ../B-release-asserts.log
        continue-on-error: true

      # (C) Dev configuration (cabal.project: -fno-ignore-asserts + -fcheck-prim-bounds)
      - name: C. DEV config
        run: |
          cd upstream
          cabal test poc-oob \
            --project-file=cabal.project \
            --constraint="blockio +serialblockio" \
            --builddir=dist-dev \
            --test-show-details=streaming > ../C-dev.log 2>&1
          echo "EXIT=$?" >> ../C-dev.log
        continue-on-error: true

      - name: Summary
        if: always()
        run: |
          for f in A-release B-release-asserts C-dev; do
            echo "########## $f ##########"
            sed -n '/=== lsm-tree RawPage offset validation PoC ===/,$p' $f.log || tail -20 $f.log
            echo
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-logs
          path: |
            A-release.log
            B-release-asserts.log
            C-dev.log

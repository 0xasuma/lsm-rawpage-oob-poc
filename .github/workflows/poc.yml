name: lsm-rawpage-oob

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  poc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: '9.6.6'
          cabal-version: '3.10.3.0'

      - name: Fetch upstream lsm-tree at audited commit
        run: |
          git clone https://github.com/IntersectMBO/lsm-tree.git upstream
          cd upstream
          git checkout 63a6305
          git log --oneline -1
          mkdir -p lsm-tree/poc
          cp ../Poc.hs lsm-tree/poc/Poc.hs
          cat ../poc-stanza.txt >> lsm-tree/lsm-tree.cabal
          cabal update

      - name: Build A (release/production) and B (release + asserts restored)
        run: |
          cd upstream
          set +e
          cabal build poc-oob --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" > /dev/null 2>&1
          echo "A_BUILD=$?"
          cabal build poc-oob --project-file=cabal.project.release \
            --constraint="blockio +serialblockio" \
            --ghc-options="-fno-ignore-asserts" --builddir=dist-asserts > /dev/null 2>&1
          echo "B_BUILD=$?"

      - name: Run 2x2 matrix (control vs tampered, x2 build configs)
        run: |
          cd upstream
          set +e
          BA=$(find dist-newstyle -type f -name poc-oob -perm -u+x | head -1)
          BB=$(find dist-asserts   -type f -name poc-oob -perm -u+x | head -1)
          run() { # label binary extra-arg
            local lbl=$1 bin=$2 arg=$3 out="../$1.log"
            : > "$out"
            echo "### $lbl  binary=$bin  arg=${arg:-<none>}" >> "$out"
            "$bin" $arg >> "$out" 2>&1
            local rc=$?
            echo "RUN_EXIT=$rc" >> "$out"
            [ $rc -gt 128 ] && echo "SIGNAL=$((rc-128))  (11=SIGSEGV 6=SIGABRT 4=SIGILL)" >> "$out"
            echo "--- $lbl RUN_EXIT=$rc ---"
          }
          run A1-prod-control   "$BA" "--control"
          run A2-prod-tampered  "$BA" ""
          run B1-assert-control "$BB" "--control"
          run B2-assert-tampered "$BB" ""

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poc-logs
          path: |
            A1-prod-control.log
            A2-prod-tampered.log
            B1-assert-control.log
            B2-assert-tampered.log
